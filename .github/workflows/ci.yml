name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - run: node --test tests/check-setup.test.mjs
