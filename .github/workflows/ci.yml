name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test | tee "$RUNNER_TEMP/eighty-tests.log"
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rules-test-results
          path: |
            ${{ runner.temp }}/eighty-tests.log
            docs/tests/results/answer-key.md
      - run: pnpm agent-native:doctor
      - run: docker build --tag eighty:check .
      - run: pnpm check:production eighty:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-browser-results
          include-hidden-files: true
          path: |
            .private/browser-report/
            .private/browser-results/
