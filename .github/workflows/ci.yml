name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm agent-native:doctor
      - run: docker build --tag eighty:check .
      - run: pnpm check:production eighty:check
